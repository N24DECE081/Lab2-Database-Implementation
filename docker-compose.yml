name: student-registration-labs
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql_dev}
      MYSQL_DATABASE: student_reg_db
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-lab_api_dev}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:-lab_report_dev}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/lab/sql:ro
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 4s
      timeout: 5s
      retries: 40
  api:
    build: .
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: student_reg_db
      MYSQL_USER: lab_api
      MYSQL_PASSWORD: ${APP_DB_PASSWORD:-lab_api_dev}
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 15
  tests:
    image: student-registration-labs-api
    profiles: ["test"]
    environment:
      TEST_MYSQL_HOST: mysql
      TEST_MYSQL_PORT: 3306
      TEST_MYSQL_USER: root
      TEST_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql_dev}
    depends_on:
      mysql:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-q"]

volumes:
  mysql_data:
